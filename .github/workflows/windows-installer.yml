# Установщик Windows (NSIS) для десктоп-плеера: тесты, сборка и дымовая
# проверка установки на настоящей Windows. Запуск вручную или тегом v*;
# по тегу — ещё и черновик релиза с setup.exe. Минуты — docs/ci-cd.md (§2).
name: windows-installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Тег совпадает с версией приложения
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content player/shells/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Тег $env:GITHUB_REF_NAME, а в tauri.conf.json версия $version" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Rust и pnpm
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          npm install --global pnpm@10.28.0
      - name: Тесты ядра
        working-directory: player/core
        run: cargo test --workspace
      - name: Интерфейс — типы и тесты
        working-directory: player/shells/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
      - name: Тесты оболочки
        working-directory: player/shells/desktop/src-tauri
        run: cargo test
      - name: Сборка установщика
        working-directory: player/shells/desktop
        run: pnpm tauri build
      - name: Дымовая проверка установки
        working-directory: player/shells/desktop
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/windows-smoke.ps1 -Installer $setup.FullName -Screenshot "$env:RUNNER_TEMP/scrobb-player.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scrobb-player-windows
          path: player/shells/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Снимок экрана после проверки
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/scrobb-player.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scrobb-player-windows
          path: installer
      - name: Черновик релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installer/*-setup.exe --clobber
          else
            gh release create "$TAG" installer/*-setup.exe --draft --generate-notes --title "Scrobb Player $TAG"
          fi
